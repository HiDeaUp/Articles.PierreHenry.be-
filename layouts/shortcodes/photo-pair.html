{{- $label := .Get "label" | default "Galerie de deux photos personnelles" -}}
<div class="about-photo-grid" role="group" aria-label="{{ $label }}">
  <figure itemscope itemtype="https://schema.org/ImageObject">
    <img
      src="{{ .Get "src1" }}"
      alt="{{ .Get "alt1" }}"
      title="{{ .Get "title1" }}"
      loading="lazy"
      decoding="async"
      itemprop="contentUrl"
    />
    <meta itemprop="name" content="{{ .Get "title1" }}" />
    <figcaption class="image-caption" itemprop="caption">{{ .Get "caption1" | markdownify }}</figcaption>
  </figure>
  <figure itemscope itemtype="https://schema.org/ImageObject">
    <img
      src="{{ .Get "src2" }}"
      alt="{{ .Get "alt2" }}"
      title="{{ .Get "title2" }}"
      loading="lazy"
      decoding="async"
      itemprop="contentUrl"
    />
    <meta itemprop="name" content="{{ .Get "title2" }}" />
    <figcaption class="image-caption" itemprop="caption">{{ .Get "caption2" | markdownify }}</figcaption>
  </figure>
</div>
